<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemGraph 知识图谱测试面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .results-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .results-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .result-item {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .result-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .result-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .result-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .meta-item {
            text-align: center;
        }

        .meta-item .label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 3px;
        }

        .meta-item .value {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .result-tags {
            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;
            background: #e0e7ff;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-right: 8px;
            margin-bottom: 5px;
        }

        .result-content {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .result-content h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .result-content p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .score-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 6px;
            border-left: 4px solid #ffc107;
        }

        .score-item {
            text-align: center;
        }

        .score-item .label {
            font-size: 0.8em;
            color: #856404;
            margin-bottom: 3px;
        }

        .score-item .value {
            font-weight: bold;
            color: #856404;
            font-size: 1em;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .search-info h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .search-info p {
            color: #0d47a1;
            margin: 5px 0;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-meta {
                grid-template-columns: 1fr;
            }

            .score-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 MemGraph 知识图谱</h1>
            <p>激活式搜索 + FAISS 向量相似度 | Qwen3-8B 语义嵌入</p>
            <p style="margin-top: 10px;">
                <a href="/static/debug.html" style="color: white; text-decoration: underline;">🔬 打开调试面板</a>
                <span style="margin: 0 10px;">|</span>
                <a href="/docs" target="_blank" style="color: white; text-decoration: underline;">📚 API文档</a>
            </p>
        </div>

        <div class="main-content">
            <!-- 记录新经验 -->
            <div class="card">
                <h2>📝 记录新经验</h2>
                <div id="recordMessage" class="message"></div>
                <form id="recordForm">
                    <div class="form-group">
                        <label>角色</label>
                        <select id="role" required>
                            <option value="AI">AI</option>
                            <option value="用户">用户</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>项目名称</label>
                        <input type="text" id="project" placeholder="例如: MemGraph开发">
                    </div>
                    <div class="form-group">
                        <label>项目路径</label>
                        <input type="text" id="directory" placeholder="例如: D:\work\AIGenTest\MemGraph">
                    </div>
                    <div class="form-group">
                        <label>问题描述 *</label>
                        <textarea id="problem" required placeholder="遇到了什么问题？"></textarea>
                    </div>
                    <div class="form-group">
                        <label>解决方法 *</label>
                        <textarea id="solution" required placeholder="如何解决的？支持 Markdown 格式"></textarea>
                    </div>
                    <div class="form-group">
                        <label>标签（逗号分隔）</label>
                        <input type="text" id="tags" placeholder="例如: Python, FAISS, 搜索引擎">
                    </div>
                    <button type="submit" class="btn">记录经验</button>
                </form>
            </div>

            <!-- 统计信息 -->
            <div class="card">
                <h2>📊 统计信息</h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-item">
                        <div class="label">文档数量</div>
                        <div class="value" id="statDocs">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">N-gram总数</div>
                        <div class="value" id="statNgrams">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">唯一N-gram</div>
                        <div class="value" id="statUniqueNgrams">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">FAISS向量</div>
                        <div class="value" id="statVectors">-</div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="loadStats()">刷新统计</button>
                <br><br>
                <button class="btn" onclick="rebuildIndex()">重建索引</button>
            </div>
        </div>

        <!-- 搜索功能 -->
        <div class="results-section">
            <h2>🔍 搜索经验</h2>
            <form id="searchForm" style="margin-bottom: 20px;">
                <div class="form-group">
                    <input type="text" id="searchQuery" placeholder="输入搜索关键词..." required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>结果数量</label>
                        <input type="number" id="searchLimit" value="5" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label>最小得分</label>
                        <input type="number" id="searchMinScore" value="0.1" min="0" max="100" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>向量搜索</label>
                        <select id="searchUseVector">
                            <option value="true">启用</option>
                            <option value="false">禁用</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn">搜索</button>
            </form>

            <div id="searchMessage" class="message"></div>
            <div id="searchLoading" class="loading">
                <div class="spinner"></div>
                <p>搜索中...</p>
            </div>

            <div id="searchResults"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8800';

        // HTML转义函数，防止XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 加载统计信息
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();

                document.getElementById('statDocs').textContent = data.documents;
                document.getElementById('statNgrams').textContent = data.ngrams;
                document.getElementById('statUniqueNgrams').textContent = data.unique_ngrams;
                document.getElementById('statVectors').textContent = data.faiss_vectors;
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // 记录新经验
        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const messageEl = document.getElementById('recordMessage');
            const tags = document.getElementById('tags').value
                .split(',')
                .map(t => t.trim())
                .filter(t => t);

            const data = {
                role: document.getElementById('role').value,
                project: document.getElementById('project').value || undefined,
                directory: document.getElementById('directory').value || undefined,
                problem: document.getElementById('problem').value,
                solution: document.getElementById('solution').value,
                tags: tags.length > 0 ? tags : undefined
            };

            try {
                const response = await fetch(`${API_BASE}/record`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    messageEl.className = 'message success show';
                    messageEl.textContent = `✅ 记录成功！路径: ${result.path}`;
                    document.getElementById('recordForm').reset();
                    loadStats();
                } else {
                    throw new Error(result.detail || '记录失败');
                }
            } catch (error) {
                messageEl.className = 'message error show';
                messageEl.textContent = `❌ 错误: ${error.message}`;
            }

            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        });

        // 搜索功能
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const query = document.getElementById('searchQuery').value;
            const limit = parseInt(document.getElementById('searchLimit').value);
            const minScore = parseFloat(document.getElementById('searchMinScore').value);
            const useVector = document.getElementById('searchUseVector').value === 'true';

            const messageEl = document.getElementById('searchMessage');
            const loadingEl = document.getElementById('searchLoading');
            const resultsEl = document.getElementById('searchResults');

            loadingEl.className = 'loading show';
            resultsEl.innerHTML = '';
            messageEl.className = 'message';

            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit, min_score: minScore, use_vector: useVector })
                });

                const data = await response.json();
                loadingEl.className = 'loading';

                if (response.ok) {
                    displaySearchResults(data);
                } else {
                    throw new Error(data.detail || '搜索失败');
                }
            } catch (error) {
                loadingEl.className = 'loading';
                messageEl.className = 'message error show';
                messageEl.textContent = `❌ 错误: ${error.message}`;
            }
        });

        // 显示搜索结果
        function displaySearchResults(data) {
            const resultsEl = document.getElementById('searchResults');

            if (data.count === 0) {
                resultsEl.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">未找到相关结果</p>';
                return;
            }

            let html = `
                <div class="search-info">
                    <h3>搜索结果统计</h3>
                    <p><strong>查询:</strong> "${data.query}"</p>
                    <p><strong>找到:</strong> ${data.count} 条结果</p>
                </div>
            `;

            data.results.forEach((result, index) => {
                const tagsHtml = result.tags && result.tags.length > 0
                    ? `<div class="result-tags">${result.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>`
                    : '';

                html += `
                    <div class="result-item">
                        <div class="result-header">
                            <div class="result-title">${index + 1}. ${result.path}</div>
                            <div class="result-score">${result.total_score.toFixed(2)}</div>
                        </div>

                        <div class="result-meta">
                            <div class="meta-item">
                                <div class="label">角色</div>
                                <div class="value">${result.role || 'AI'}</div>
                            </div>
                            <div class="meta-item">
                                <div class="label">项目</div>
                                <div class="value">${result.project || '-'}</div>
                            </div>
                            <div class="meta-item">
                                <div class="label">时间</div>
                                <div class="value">${result.timestamp || '-'}</div>
                            </div>
                        </div>

                        ${tagsHtml}

                        <div class="score-breakdown">
                            <div class="score-item">
                                <div class="label">激活得分</div>
                                <div class="value">${result.activation_score ? result.activation_score.toFixed(2) : '-'}</div>
                            </div>
                            <div class="score-item">
                                <div class="label">向量相似度</div>
                                <div class="value">${result.vector_similarity !== undefined ? result.vector_similarity.toFixed(3) : '-'}</div>
                            </div>
                            <div class="score-item">
                                <div class="label">匹配片段</div>
                                <div class="value">${result.matched_ngrams || 0}</div>
                            </div>
                        </div>

                        <div class="result-content">
                            <h4>问题</h4>
                            <p>${escapeHtml(result.problem_preview || result.problem || '-')}</p>
                            ${result.solution_preview || result.solution ? `
                                <h4>解决方法（预览前300字符）</h4>
                                <p>${escapeHtml((result.solution_preview || result.solution || '').substring(0, 300))}${((result.solution_preview || result.solution || '').length > 300 ? '...' : '')}</p>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            resultsEl.innerHTML = html;
        }

        // 重建索引
        async function rebuildIndex() {
            if (!confirm('确定要重建索引吗？这可能需要一些时间。')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/rebuild`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ 索引重建完成！\n文档数: ${data.stats.documents}\nN-gram总数: ${data.stats.ngrams}\n唯一N-gram: ${data.stats.unique_ngrams}\nFAISS向量数: ${data.stats.faiss_vectors}`);
                    loadStats();
                } else {
                    throw new Error(data.detail || '重建失败');
                }
            } catch (error) {
                alert(`❌ 错误: ${error.message}`);
            }
        }

        // 页面加载时获取统计信息
        loadStats();
    </script>
</body>
</html>
