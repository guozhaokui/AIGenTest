<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemGraph 底层调试面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: white;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255,255,255,0.9);
        }

        .section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: #4ec9b0;
            margin-bottom: 15px;
            border-bottom: 2px solid #3e3e42;
            padding-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #1177bb;
        }

        .btn-danger {
            background: #d73a49;
        }

        .btn-danger:hover {
            background: #cb2431;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #22863a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #2d2d30;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #4ec9b0;
        }

        .stat-label {
            color: #858585;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #4ec9b0;
            font-size: 24px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #2d2d30;
            color: #4ec9b0;
            padding: 10px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #3e3e42;
        }

        tr:hover {
            background: #2d2d30;
        }

        .doc-id {
            color: #ce9178;
            font-weight: bold;
        }

        .vector-preview {
            font-size: 11px;
            color: #858585;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vector-full {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            font-size: 11px;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }

        .show-vector {
            color: #4ec9b0;
            cursor: pointer;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #858585;
        }

        .spinner {
            border: 4px solid #3e3e42;
            border-top: 4px solid #4ec9b0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #3a1f1f;
            border-left: 3px solid #d73a49;
            color: #f97583;
        }

        .message.success {
            background: #1f3a1f;
            border-left: 3px solid #28a745;
            color: #85e89d;
        }

        .message.warning {
            background: #3a321f;
            border-left: 3px solid #ffc107;
            color: #ffd454;
        }

        .ngram-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            background: #264f78;
            color: #9cdcfe;
        }

        .section-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            background: #553a3a;
            color: #ce9178;
        }

        .highlight {
            background: #ffd454;
            color: #1e1e1e;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .vector-stats {
            background: #2d2d30;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
        }

        .vector-dimension {
            color: #4ec9b0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 MemGraph 底层调试面板</h1>
            <p>检查向量索引、文档映射、FAISS 状态</p>
        </div>

        <div id="message" class="message"></div>

        <!-- 系统状态 -->
        <div class="section">
            <h2>系统状态</h2>
            <div class="stats-grid" id="systemStats">
                <div class="stat-card">
                    <div class="stat-label">文档数</div>
                    <div class="stat-value" id="statDocs">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">FAISS向量数</div>
                    <div class="stat-value" id="statVectors">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">N-gram总数</div>
                    <div class="stat-value" id="statNgrams">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">唯一N-gram</div>
                    <div class="stat-value" id="statUniqueNgrams">-</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" onclick="loadAllData()">刷新数据</button>
                <button class="btn btn-success" onclick="testEmbedding()">测试嵌入服务</button>
                <button class="btn btn-danger" onclick="rebuildIndex()">重建索引</button>
            </div>
        </div>

        <!-- 向量索引详情 -->
        <div class="section">
            <h2>向量索引详情</h2>
            <div id="vectorLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div id="vectorContent"></div>
        </div>

        <!-- 文档-向量映射 -->
        <div class="section">
            <h2>文档列表与向量映射</h2>
            <div id="docLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div id="docContent"></div>
        </div>

        <!-- N-gram 分布 -->
        <div class="section">
            <h2>N-gram 分布统计</h2>
            <div id="ngramLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
            <div id="ngramContent"></div>
        </div>

        <!-- 向量相似度搜索 -->
        <div class="section">
            <h2>🔍 向量相似度搜索</h2>
            <p style="color: #858585; margin-bottom: 15px;">输入查询问题，查看所有文档向量的相似度排序</p>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="vectorSearchQuery" placeholder="输入查询问题，例如：如何在claude-code中添加mcp服务器"
                       style="flex: 1; padding: 10px; background: #2d2d30; border: 1px solid #3e3e42; color: #d4d4d4; border-radius: 4px;">
                <input type="number" id="vectorSearchTopK" value="10" min="1" max="50"
                       style="width: 100px; padding: 10px; background: #2d2d30; border: 1px solid #3e3e42; color: #d4d4d4; border-radius: 4px;"
                       placeholder="Top K">
                <button class="btn" onclick="searchVectorSimilarity()">搜索</button>
            </div>

            <div id="vectorSearchLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>计算相似度中...</p>
            </div>
            <div id="vectorSearchContent"></div>
        </div>

        <!-- N-gram 匹配详情搜索 -->
        <div class="section">
            <h2>🎯 完整搜索调试（含 N-gram 匹配）</h2>
            <p style="color: #858585; margin-bottom: 15px;">查看激活式搜索 + 向量相似度的完整调试信息，包括匹配的所有 n-gram</p>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="fullSearchQuery" placeholder="输入查询问题，例如：如何配置mcp"
                       style="flex: 1; padding: 10px; background: #2d2d30; border: 1px solid #3e3e42; color: #d4d4d4; border-radius: 4px;">
                <input type="number" id="fullSearchLimit" value="5" min="1" max="20"
                       style="width: 100px; padding: 10px; background: #2d2d30; border: 1px solid #3e3e42; color: #d4d4d4; border-radius: 4px;"
                       placeholder="Limit">
                <button class="btn" onclick="searchFullDebug()">搜索</button>
            </div>

            <div id="fullSearchLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>搜索中...</p>
            </div>
            <div id="fullSearchContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8800';

        function showMessage(text, type = 'success') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type} show`;
            setTimeout(() => {
                msgEl.className = 'message';
            }, 5000);
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();

                document.getElementById('statDocs').textContent = data.documents;
                document.getElementById('statVectors').textContent = data.faiss_vectors;
                document.getElementById('statNgrams').textContent = data.ngrams;
                document.getElementById('statUniqueNgrams').textContent = data.unique_ngrams;

                // 检查异常
                if (data.documents > 0 && data.faiss_vectors === 0) {
                    showMessage('⚠️ 警告: 有文档但没有向量！可能索引构建失败。', 'warning');
                } else if (data.documents !== data.faiss_vectors) {
                    showMessage(`⚠️ 警告: 文档数(${data.documents})和向量数(${data.faiss_vectors})不一致！`, 'warning');
                }
            } catch (error) {
                showMessage(`❌ 加载统计失败: ${error.message}`, 'error');
            }
        }

        async function loadVectorIndex() {
            const loadingEl = document.getElementById('vectorLoading');
            const contentEl = document.getElementById('vectorContent');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/debug/vectors`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                loadingEl.style.display = 'none';

                if (data.vectors.length === 0) {
                    contentEl.innerHTML = '<p style="color: #858585;">没有向量数据</p>';
                    return;
                }

                let html = `
                    <div class="vector-stats">
                        <p>向量总数: <span class="vector-dimension">${data.total_vectors}</span></p>
                        <p>向量维度: <span class="vector-dimension">${data.dimension}</span></p>
                        <p>索引类型: <span class="vector-dimension">${data.index_type}</span></p>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>FAISS索引</th>
                                    <th>文档ID</th>
                                    <th>文档路径</th>
                                    <th>向量范数</th>
                                    <th>向量预览</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.vectors.forEach((vec, idx) => {
                    const vectorId = `vector_${idx}`;
                    html += `
                        <tr>
                            <td><span class="doc-id">${vec.faiss_index}</span></td>
                            <td><span class="doc-id">${vec.doc_id}</span></td>
                            <td>${vec.path || '-'}</td>
                            <td>${vec.norm.toFixed(4)}</td>
                            <td class="vector-preview">[${vec.preview.join(', ')}...]</td>
                            <td>
                                <span class="show-vector" onclick="toggleVector('${vectorId}')">显示完整向量</span>
                                <div id="${vectorId}" class="vector-full">${vec.full_vector}</div>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                contentEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = `<p style="color: #f97583;">❌ 加载失败: ${error.message}</p>`;
            }
        }

        async function loadDocuments() {
            const loadingEl = document.getElementById('docLoading');
            const contentEl = document.getElementById('docContent');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/debug/documents`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                loadingEl.style.display = 'none';

                if (data.documents.length === 0) {
                    contentEl.innerHTML = '<p style="color: #858585;">没有文档数据</p>';
                    return;
                }

                let html = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>文档ID</th>
                                    <th>FAISS索引</th>
                                    <th>路径</th>
                                    <th>角色</th>
                                    <th>项目</th>
                                    <th>时间</th>
                                    <th>标签</th>
                                    <th>问题预览</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.documents.forEach(doc => {
                    const hasFaiss = doc.has_faiss_vector ? '✅' : '❌';
                    const faissIndex = doc.faiss_index !== null ? doc.faiss_index : '-';
                    const tags = doc.tags.length > 0 ? doc.tags.join(', ') : '-';

                    html += `
                        <tr>
                            <td><span class="doc-id">${doc.doc_id}</span></td>
                            <td>${hasFaiss} ${faissIndex}</td>
                            <td>${doc.path}</td>
                            <td>${doc.role}</td>
                            <td>${doc.project || '-'}</td>
                            <td>${doc.timestamp}</td>
                            <td>${tags}</td>
                            <td>${doc.problem_preview}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                contentEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = `<p style="color: #f97583;">❌ 加载失败: ${error.message}</p>`;
            }
        }

        async function loadNgramStats() {
            const loadingEl = document.getElementById('ngramLoading');
            const contentEl = document.getElementById('ngramContent');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/debug/ngrams`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                loadingEl.style.display = 'none';

                let html = `
                    <div class="stats-grid">
                `;

                for (const [type, count] of Object.entries(data.by_type)) {
                    html += `
                        <div class="stat-card">
                            <div class="stat-label">${type}</div>
                            <div class="stat-value">${count}</div>
                        </div>
                    `;
                }

                html += `
                    </div>
                    <h3 style="color: #4ec9b0; margin-top: 20px; margin-bottom: 10px;">Top 50 N-gram（按文档数排序）</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>内容</th>
                                    <th>类型</th>
                                    <th>出现在文档数</th>
                                    <th>总出现次数</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.top_ngrams.forEach(ngram => {
                    html += `
                        <tr>
                            <td><span class="highlight">${ngram.content}</span></td>
                            <td><span class="ngram-type">${ngram.gram_type}</span></td>
                            <td>${ngram.doc_count}</td>
                            <td>${ngram.total_count}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                contentEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = `<p style="color: #f97583;">❌ 加载失败: ${error.message}</p>`;
            }
        }

        function toggleVector(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        async function loadAllData() {
            await loadStats();
            await loadVectorIndex();
            await loadDocuments();
            await loadNgramStats();
        }

        async function testEmbedding() {
            try {
                const response = await fetch(`${API_BASE}/debug/test-embedding`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    showMessage(`✅ 嵌入服务正常！维度: ${data.dimension}, 耗时: ${data.time_ms}ms`, 'success');
                } else {
                    showMessage(`❌ 嵌入服务失败: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage(`❌ 测试失败: ${error.message}`, 'error');
            }
        }

        async function rebuildIndex() {
            if (!confirm('确定要重建索引吗？这将清空所有数据并重新索引。')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/rebuild`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                showMessage(`✅ 索引重建完成！文档数: ${data.stats.documents}`, 'success');

                // 重新加载数据
                await loadAllData();
            } catch (error) {
                showMessage(`❌ 重建失败: ${error.message}`, 'error');
            }
        }

        async function searchVectorSimilarity() {
            const query = document.getElementById('vectorSearchQuery').value.trim();
            const topK = parseInt(document.getElementById('vectorSearchTopK').value);

            if (!query) {
                showMessage('请输入查询问题', 'error');
                return;
            }

            const loadingEl = document.getElementById('vectorSearchLoading');
            const contentEl = document.getElementById('vectorSearchContent');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/debug/vector-similarity`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: topK })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.error) {
                    contentEl.innerHTML = `<p style="color: #f97583;">❌ 错误: ${data.error}</p>`;
                    return;
                }

                // 显示查询统计
                let html = `
                    <div class="vector-stats">
                        <p><strong>查询:</strong> "${data.query}"</p>
                        <p><strong>查询向量范数:</strong> ${data.query_embedding_norm.toFixed(4)}</p>
                        <p><strong>嵌入耗时:</strong> ${data.embed_time_ms}ms</p>
                        <p><strong>搜索耗时:</strong> ${data.search_time_ms}ms</p>
                        <p><strong>总文档数:</strong> ${data.total_documents} | <strong>返回:</strong> ${data.returned_count}</p>
                    </div>

                    <div class="table-container" style="margin-top: 20px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>相似度</th>
                                    <th>文档ID</th>
                                    <th>FAISS索引</th>
                                    <th>路径</th>
                                    <th>标签</th>
                                    <th>向量范数</th>
                                    <th>问题预览</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.results.forEach((result, idx) => {
                    // 相似度着色
                    let simColor = '#4ec9b0';
                    if (result.similarity < 0.3) {
                        simColor = '#ce9178';
                    } else if (result.similarity < 0.6) {
                        simColor = '#dcdcaa';
                    }

                    const tags = result.tags.length > 0 ? result.tags.join(', ') : '-';
                    const resultId = `result_${idx}`;

                    html += `
                        <tr style="cursor: pointer;" onclick="toggleResultDetail('${resultId}')">
                            <td><strong>${idx + 1}</strong></td>
                            <td><span style="color: ${simColor}; font-weight: bold; font-size: 16px;">${result.similarity}</span></td>
                            <td><span class="doc-id">${result.doc_id}</span></td>
                            <td>${result.faiss_index}</td>
                            <td>${result.path}</td>
                            <td style="font-size: 11px;">${tags}</td>
                            <td>${result.vector_norm.toFixed(4)}</td>
                            <td style="max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                ${result.problem_preview}
                            </td>
                        </tr>
                        <tr id="${resultId}" style="display: none;">
                            <td colspan="8" style="background: #1e1e1e; padding: 15px;">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                    <div>
                                        <div style="margin-bottom: 15px;">
                                            <strong style="color: #4ec9b0;">问题:</strong>
                                            <p style="margin: 5px 0; color: #d4d4d4;">${result.problem_preview}</p>
                                        </div>
                                        <div>
                                            <strong style="color: #4ec9b0;">解决方法预览:</strong>
                                            <p style="margin: 5px 0; color: #d4d4d4;">${result.solution_preview}</p>
                                        </div>
                                        <div style="margin-top: 10px; padding: 10px; background: #2d2d30; border-radius: 4px;">
                                            <strong style="color: #dcdcaa;">调试信息:</strong>
                                            <p style="margin: 5px 0; color: #858585;">角色: ${result.role} | 项目: ${result.project}</p>
                                        </div>
                                    </div>
                                    <div id="ngrams_${resultId}" style="padding: 10px; background: #2d2d30; border-radius: 4px; max-height: 300px; overflow-y: auto;">
                                        <strong style="color: #ce9178;">🔍 N-gram 匹配详情</strong>
                                        <p style="margin: 5px 0; color: #858585; font-size: 11px;">加载中...</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>

                    <div style="margin-top: 15px; padding: 10px; background: #2d2d30; border-radius: 4px; color: #858585; font-size: 12px;">
                        💡 <strong>提示:</strong> 点击表格行查看详细信息。相似度越高（接近1.0）表示语义越相关。
                    </div>
                `;

                contentEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = `<p style="color: #f97583;">❌ 搜索失败: ${error.message}</p>`;
            }
        }

        function toggleResultDetail(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'table-row' ? 'none' : 'table-row';
        }

        async function searchFullDebug() {
            const query = document.getElementById('fullSearchQuery').value.trim();
            const limit = parseInt(document.getElementById('fullSearchLimit').value);

            if (!query) {
                showMessage('请输入查询问题', 'error');
                return;
            }

            const loadingEl = document.getElementById('fullSearchLoading');
            const contentEl = document.getElementById('fullSearchContent');

            loadingEl.style.display = 'block';
            contentEl.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/debug/search-full`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit, min_score: 0.0 })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.error) {
                    contentEl.innerHTML = `<p style="color: #f97583;">❌ 错误: ${data.error}</p>`;
                    return;
                }

                // 显示结果
                let html = `
                    <div class="vector-stats">
                        <p><strong>查询:</strong> "${data.query}"</p>
                        <p><strong>找到:</strong> ${data.count} 条结果</p>
                    </div>
                `;

                data.results.forEach((result, idx) => {
                    const resultId = `full_result_${idx}`;

                    // N-gram 统计
                    const ngramTypes = {};
                    if (result.match_details) {
                        result.match_details.forEach(detail => {
                            ngramTypes[detail.type] = (ngramTypes[detail.type] || 0) + 1;
                        });
                    }

                    const ngramSummary = Object.entries(ngramTypes)
                        .map(([type, count]) => `${type}(${count})`)
                        .join(', ');

                    html += `
                        <div style="border: 2px solid #3e3e42; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #252526;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <div>
                                    <strong style="color: #4ec9b0; font-size: 16px;">${idx + 1}. ${result.path}</strong>
                                </div>
                                <div style="text-align: right;">
                                    <span style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 16px;">
                                        ${result.total_score.toFixed(2)}
                                    </span>
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; padding: 10px; background: #2d2d30; border-radius: 4px;">
                                <div>
                                    <div style="color: #858585; font-size: 11px;">激活得分</div>
                                    <div style="color: #4ec9b0; font-weight: bold;">${result.activation_score ? result.activation_score.toFixed(2) : '-'}</div>
                                </div>
                                <div>
                                    <div style="color: #858585; font-size: 11px;">向量相似度</div>
                                    <div style="color: #4ec9b0; font-weight: bold;">${result.vector_similarity !== undefined ? result.vector_similarity.toFixed(4) : '-'}</div>
                                </div>
                                <div>
                                    <div style="color: #858585; font-size: 11px;">匹配片段</div>
                                    <div style="color: #4ec9b0; font-weight: bold;">${result.matched_ngrams || 0}</div>
                                </div>
                                <div>
                                    <div style="color: #858585; font-size: 11px;">N-gram类型</div>
                                    <div style="color: #dcdcaa; font-weight: bold; font-size: 10px;">${ngramSummary || '-'}</div>
                                </div>
                            </div>

                            <div style="margin-bottom: 10px;">
                                <button class="btn" style="width: auto; padding: 8px 20px;" onclick="toggleNgramDetails('${resultId}')">
                                    显示/隐藏 N-gram 匹配详情 (${result.matched_ngrams || 0} 条)
                                </button>
                            </div>

                            <div id="${resultId}" style="display: none; max-height: 400px; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 4px;">
                                <strong style="color: #ce9178;">🔍 N-gram 匹配详情</strong>
                                <table style="width: 100%; margin-top: 10px; font-size: 12px;">
                                    <thead>
                                        <tr style="border-bottom: 1px solid #3e3e42;">
                                            <th style="text-align: left; padding: 5px; color: #4ec9b0;">#</th>
                                            <th style="text-align: left; padding: 5px; color: #4ec9b0;">内容</th>
                                            <th style="text-align: left; padding: 5px; color: #4ec9b0;">类型</th>
                                            <th style="text-align: left; padding: 5px; color: #4ec9b0;">片段大小</th>
                                            <th style="text-align: left; padding: 5px; color: #4ec9b0;">章节</th>
                                            <th style="text-align: right; padding: 5px; color: #4ec9b0;">得分</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    if (result.match_details && result.match_details.length > 0) {
                        result.match_details.forEach((detail, detailIdx) => {
                            html += `
                                <tr style="border-bottom: 1px solid #3e3e42;">
                                    <td style="padding: 5px; color: #858585;">${detailIdx + 1}</td>
                                    <td style="padding: 5px; color: #d4d4d4;"><code style="background: #2d2d30; padding: 2px 6px; border-radius: 3px;">${detail.content}</code></td>
                                    <td style="padding: 5px;"><span class="ngram-type">${detail.type}</span></td>
                                    <td style="padding: 5px; color: #858585;">${detail.content.length}</td>
                                    <td style="padding: 5px;"><span class="section-badge">${detail.section}</span></td>
                                    <td style="padding: 5px; color: #dcdcaa; text-align: right; font-weight: bold;">${detail.score.toFixed(2)}</td>
                                </tr>
                            `;
                        });
                    } else {
                        html += `
                            <tr>
                                <td colspan="6" style="padding: 10px; text-align: center; color: #858585;">无匹配详情</td>
                            </tr>
                        `;
                    }

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });

                contentEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                contentEl.innerHTML = `<p style="color: #f97583;">❌ 搜索失败: ${error.message}</p>`;
            }
        }

        function toggleNgramDetails(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        // 支持回车搜索
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('vectorSearchQuery');
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchVectorSimilarity();
                    }
                });
            }

            const fullInput = document.getElementById('fullSearchQuery');
            if (fullInput) {
                fullInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchFullDebug();
                    }
                });
            }
        });

        // 页面加载时自动加载数据
        window.addEventListener('DOMContentLoaded', () => {
            loadAllData();
        });
    </script>
</body>
</html>
